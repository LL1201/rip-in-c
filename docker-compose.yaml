networks:
  rip-in-c-ax-net:
    ipam:
      config:
        - subnet: 10.12.10.0/24
  rip-in-c-ab-net:
    ipam:
      config:
        - subnet: 10.12.1.0/24
  rip-in-c-bc-net:
    ipam:
      config:
        - subnet: 10.12.2.0/24
  rip-in-c-cy-net:
    ipam:
      config:
        - subnet: 10.12.20.0/24

services:
  # --- CLIENT rete AX ---
  client_ax:    
    image: ubuntu:22.04
    container_name: client-AX
    networks:
      rip-in-c-ax-net:
        ipv4_address: 10.12.10.99
    command: >
      bash -c "apt-get update && apt-get install -y iputils-ping iproute2 &&
      ip route del default &&
      ip route add default via 10.12.10.254 &&
      tail -f /dev/null"
    cap_add:
      - NET_ADMIN # Necessario per modificare la tabella di routing del container

  # --- ROUTER A ---
  router_a:    
    build: .
    container_name: router-A
    networks:
      rip-in-c-ax-net:
        ipv4_address: 10.12.10.254
      rip-in-c-ab-net:
        ipv4_address: 10.12.1.3
    volumes:
      - ./configs/router-A.config:/app/router.config
    sysctls:
      - net.ipv4.ip_forward=1 # ABILITA IL ROUTING DI LINUX
    cap_add:
      - NET_ADMIN

  # --- ROUTER B ---
  router_b:
    build: .
    container_name: router-B
    networks:
      rip-in-c-ab-net:
        ipv4_address: 10.12.1.2
      rip-in-c-bc-net:
        ipv4_address: 10.12.2.2
    volumes:
      - ./configs/router-B.config:/app/router.config
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN

  # --- ROUTER C ---
  router_c:
    build: .
    container_name: router-C
    networks:
      rip-in-c-bc-net:
        ipv4_address: 10.12.2.3
      rip-in-c-cy-net:
        ipv4_address: 10.12.20.254
    volumes:
      - ./configs/router-C.config:/app/router.config
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN

  # --- CLIENT rete CY ---
  client_cy:
    image: ubuntu:22.04
    container_name: client-CY
    networks:
      rip-in-c-cy-net:
        ipv4_address: 10.12.20.99
    command: >
      bash -c "apt-get update && apt-get install -y iputils-ping iproute2 &&
      ip route del default &&
      ip route add default via 10.12.20.254 &&
      tail -f /dev/null"
    cap_add:
      - NET_ADMIN